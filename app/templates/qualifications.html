{% extends "base.html" %}
{% block title %}Qualifikationen{% endblock %}
{% block content %}
<div class="page-header"><h1>Qualifikationen</h1></div>

<div class="card">
  <form method="post" action="/qualifikationen" class="inline-form">
    <input name="code" placeholder="Kürzel, z. B. PFK" required maxlength="20" style="max-width: 140px">
    <input name="name" placeholder="Bezeichnung, z. B. Pflegefachkraft (examiniert)" required>
    <button type="submit" class="btn btn-primary">Anlegen</button>
  </form>

  <table class="table">
    <thead><tr><th>Kürzel</th><th>Bezeichnung</th><th>Mitarbeiter</th><th></th></tr></thead>
    <tbody>
      {% for q in qualifications %}
      <tr>
        <td><span class="badge badge-blue">{{ q.code }}</span></td>
        <td>{{ q.name }}</td>
        <td>{{ q.employees|length }}</td>
        <td>
          <form method="post" action="/qualifikationen/{{ q.id }}/loeschen"
                data-confirm="Qualifikation „{{ q.code }}“ löschen?">
            <button type="submit" class="btn btn-sm btn-ghost">✕</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted">Noch keine Qualifikationen angelegt.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
